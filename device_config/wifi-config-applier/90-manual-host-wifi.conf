# Keep host Wi-Fi under local NetworkManager control.
# The ESP /wifi_config topic remains available to the UART heartbeat watchdog.
# Host information continues to be published on /host_info.
[Service]
ExecStart=
ExecStart=/bin/bash -lc 'source /opt/ros/humble/setup.bash && source /root/chuyun_ws/install/setup.bash && exec ros2 run xuegecar_wifi_config wifi_config_applier --ros-args -p topic:=/wifi_config_manual_only'
